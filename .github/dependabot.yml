# Mises à jour hebdomadaires proposées en PR sur dev/main : paquets NuGet, actions des workflows et
# pointeurs des sous-modules (modules GlpiNg-fr).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev/main
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev/main
    schedule:
      interval: weekly

  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: dev/main
    schedule:
      interval: weekly
