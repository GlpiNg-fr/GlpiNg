# Publie une release GitHub à chaque tag de version (1.0.0, 1.0.0-RC1, v1.2.0...) : glping (serveur
# et CLI d'administration) compilé pour Linux et Windows, en archives zip, et l'image de conteneur rootless
# ghcr.io/glping-fr/glping (amd64, arm64). Une version stable (exactement X.Y.Z) donne l'image
# « latest » ; toute autre (1.0.0-RC1...) donne une préversion et l'image « beta ».
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Nécessaire au RUN apt-get de l'étape finale en arm64 ; la compilation, elle, se fait en natif.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Stable = exactement X.Y.Z. Tout suffixe (1.0.0-RC1, 1.0.0rc1, 1.0.0-beta.2...) = beta.
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      # 1.2.3 → 1.2.3, 1.2 et latest ; 1.0.0-RC1 → 1.0.0-RC1 et beta.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/glping-fr/glping
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
            type=raw,value=beta,enable=${{ steps.version.outputs.stable != 'true' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Une archive par plateforme : ne garde que ses bibliothèques natives (~35 Mo au lieu
        # de ~190 Mo pour toutes les plateformes). Le runtime .NET 10 reste à installer.
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publication
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish src/GlpiNg.Web/GlpiNg.Web.csproj -c Release -r "$RID" \
            --self-contained false -p:Version="$VERSION" -o publish
          (cd publish && zip -qr "$GITHUB_WORKSPACE/glping-$VERSION-$RID.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: glping-${{ matrix.rid }}
          path: glping-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Même règle que l'image : tout ce qui n'est pas exactement X.Y.Z est une préversion.
          prerelease="--prerelease"
          [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && prerelease=""
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "GlpiNg ${TAG#v}" --generate-notes $prerelease
