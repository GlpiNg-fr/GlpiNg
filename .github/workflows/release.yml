# Publie une release GitHub à chaque tag de version (1.0.0, 1.0.0-RC1, v1.2.0...) : GlpiNg.Web et
# GlpiNg.Console compilés pour Linux et Windows, en archives zip. Un tag contenant un tiret
# (1.0.0-RC1) donne une préversion.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Une archive par plateforme : ne garde que ses bibliothèques natives (~35 Mo au lieu
        # de ~190 Mo pour toutes les plateformes). Le runtime .NET 10 reste à installer.
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publication
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: |
          for project in Web Console; do
            dotnet publish "src/GlpiNg.$project/GlpiNg.$project.csproj" -c Release -r "$RID" \
              --self-contained false -p:Version="$VERSION" -o "publish/$project"
            (cd "publish/$project" && zip -qr "$GITHUB_WORKSPACE/GlpiNg.$project-$VERSION-$RID.zip" .)
          done

      - uses: actions/upload-artifact@v7
        with:
          name: glping-${{ matrix.rid }}
          path: GlpiNg.*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "GlpiNg ${TAG#v}" --generate-notes $prerelease
