# Analyse de sécurité du code C# (CodeQL). Fournit aussi les résultats d'analyse de code
# qu'exige la règle de la branche dev/main.
name: CodeQL

on:
  push:
    branches: [dev/main, main]
  pull_request:
    branches: [dev/main, main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - run: dotnet build GlpiNg.sln -c Release

      - uses: github/codeql-action/analyze@v4
