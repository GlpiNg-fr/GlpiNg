# Vérifie que la solution compile, qu'aucune dépendance n'a de vulnérabilité connue et que les
# migrations EF Core suivent le modèle.
name: CI

on:
  push:
    branches: [dev/main]
  pull_request:
    branches: [dev/main, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Les modules sont des sous-modules (dépôts publics GlpiNg-fr).
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore GlpiNg.sln

      - run: dotnet build GlpiNg.sln -c Release --no-restore

      - name: Paquets vulnérables
        run: |
          dotnet list GlpiNg.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Des paquets NuGet ont des vulnérabilités connues (voir ci-dessus)."
            exit 1
          fi

      # Un modèle modifié sans nouvelle migration casserait les installations existantes. Le
      # DbContext n'est enregistré qu'une fois l'installation terminée : on la simule, avec une
      # chaîne de connexion factice (la commande ne se connecte pas à la base).
      - name: Migrations EF Core à jour
        working-directory: src/GlpiNg.Web
        env:
          Storage__RootPath: ${{ runner.temp }}/glping-data
          Setup__IsComplete: "true"
          Setup__Provider: SqlServer
          ConnectionStrings__DefaultConnection: Server=localhost;Database=GlpiNgCi;User ID=ci;Password=ci;TrustServerCertificate=True
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release

  # L'image se construit, démarre sans droits root et répond (redirection vers l'assistant
  # d'installation, faute de base configurée).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: glping:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrage rootless
        run: |
          docker run -d --name glping -p 8080:8080 glping:ci
          uid=$(docker exec glping id -u)
          echo "UID du processus : $uid"
          if [ "$uid" = "0" ]; then echo "::error::Le conteneur tourne en root."; exit 1; fi
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          location=$(curl -s -o /dev/null -w "%{redirect_url}" http://localhost:8080/)
          echo "HTTP $code → $location"
          docker logs glping | tail -20
          case "$location" in
            */setup*) ;;
            *) echo "::error::GlpiNg ne répond pas comme attendu (HTTP $code)."; exit 1 ;;
          esac
