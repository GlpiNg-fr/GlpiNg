name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or getting in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true

  - type: input
    id: glpi
    attributes:
      label: GLPI equivalent
      description: If GLPI already has this feature, a link to its documentation or screen helps a lot.

  - type: dropdown
    id: plugin
    attributes:
      label: Could it be a plugin?
      description: Features specific to one organization often fit better as a plugin (see GlpiNg.Plugins.Sdk).
      options:
        - It belongs in GlpiNg itself
        - It could be a plugin
        - Not sure

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
